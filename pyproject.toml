[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smruti"
version = "0.2.0"
description = "A Biologically Inspired, Dual-Valence Cognitive Memory Engine for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "fastmcp>=0.1.0",
    "fastembed>=0.2.0",
    "numpy>=1.20.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.1.0",
]

[project.scripts]
smruti = "smruti.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["smruti"]

[tool.ruff]
line-length = 100
target-version = "py310"
