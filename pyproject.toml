[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orma-ai"
version = "0.1.6"
description = "Local episode-first long-term memory for small LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastembed>=0.2.0",
    "numpy>=1.20.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "typer>=0.9.0",
    "dateparser>=1.2.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
orma = "orma.cli:app"
smruti = "orma.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["orma"]

[tool.ruff]
line-length = 100
target-version = "py310"
